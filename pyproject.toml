[project]
name = "python-id-benchmarks"
version = "0.1.0"
description = "Benchmarks for various Python ID generators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cuid2==2.0.1",
    "cyksuid==2.1.0",
    "epyxid==0.3.5",
    "python-baseconv==1.2.2",
    "python-ulid==3.1.0",
    "snowflake-id==1.0.2",
    "svix-ksuid==0.6.2",
    "timeflake==0.4.3",
]

[dependency-groups]
dev = [
    "attrs==25.4.0",
    "iniconfig==2.3.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "py-cpuinfo==9.0.0",
    "pytest==9.0.2",
    "pytest-benchmark==5.2.3",
    "typing-extensions>=4.0.0",
]
