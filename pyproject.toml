[project]
name = "python-id-benchmarks"
version = "0.1.0"
description = "Benchmarks for various Python ID generators"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cuid2==2.0.1",
    "cyksuid==2.1.0",
    "epyxid>=0.3.3",
    "python-baseconv==1.2.2",
    "python-ulid==3.0.0",
    "snowflake-id==1.0.2",
    "svix-ksuid==0.6.2",
    "timeflake==0.4.3",
]

[dependency-groups]
dev = [
    "attrs==25.3.0",
    "iniconfig==2.1.0",
    "packaging==24.2",
    "pluggy==1.5.0",
    "py-cpuinfo==9.0.0",
    "pytest==8.3.5",
    "pytest-benchmark==5.1.0",
]
